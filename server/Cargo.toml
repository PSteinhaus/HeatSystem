[package]
name = "heat-system-server"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rocket_ws = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["sync"] }

uuid = { version = "1", features = ["v4", "serde"] }

rand = "0.10.2"